# Generated by openclaw-provision — do not edit directly
services:
  openclaw-gateway:
    image: openclaw-bot:latest
    pull_policy: never
    container_name: ${BOT_NAME}-gateway
    env_file: .env
    environment:
      HOME: /home/node
      TERM: xterm-256color
    command: ["sh", "-c", "mkdir -p /home/node/.openclaw/cron /home/node/.openclaw/canvas /home/node/.openclaw/workspace /home/node/.openclaw/agents/main/agent && cp -n /app/config/openclaw.json /home/node/.openclaw/openclaw.json && exec node openclaw.mjs gateway"]
    volumes:
      - ./config:/app/config:ro
      - ./workspace:/app/workspace:rw
      - ./auth:/home/node/.openclaw/agents:rw
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
      - "127.0.0.1:${BRIDGE_PORT}:${BRIDGE_PORT}"
    read_only: true
    tmpfs:
      - /tmp:exec
      - /home/node/.cache
      - /home/node/.openclaw:uid=1000,gid=1000
    init: true
    restart: unless-stopped
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${GATEWAY_PORT}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - openclaw-net

networks:
  openclaw-net:
    name: openclaw-net-${BOT_NAME}
    driver: bridge
